    <!--
    Month grid goes here. One <table class="monthtable"> per month, e.g.:

    <table class="monthtable">
        <thead>
            <tr><th colspan="5" class="month-header" scope="colgroup">September</th></tr>
            <tr>
                <th class="day-header" scope="col">Monday</th>
                <th class="day-header" scope="col">Tuesday</th>
                <th class="day-header" scope="col">Wednesday</th>
                <th class="day-header" scope="col">Thursday</th>
                <th class="day-header" scope="col">Friday</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="eventtd" id="2026-09-21" aria-label="Monday September 21">
                    <span class="datespan" aria-hidden="true">21</span>
                    <div class="lecture" aria-label="lecture">
                        <span class="summary">Lecture 1</span><br>
                        <span class="description">Divide and Conquer</span><br>
                        <span class="materials"><a href="../lecture/01-divide-conquer-public.pdf">01-pdf</a></span>
                    </div>
                </td>
                <td class="noevent" id="2026-09-22" aria-label="Tuesday September 22, no events">
                    <span class="datespan" aria-hidden="true">22</span>
                </td>
                ... three more <td> to fill out Wednesday-Friday ...
            </tr>
        </tbody>
    </table>

    Event div classes control the color: lecture, section, lab, exam, hw, oh,
    holiday, other. Days outside the quarter use <td class="notinquarter">.
    -->
